<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>bench mini-app</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, sans-serif; display: flex; height: 100vh; background: #1e1e1e; color: #eee; }
      nav { width: 160px; background: #171717; padding: 12px; }
      nav .item { padding: 8px 10px; border-radius: 6px; margin-bottom: 4px; cursor: default; }
      nav .item.active { background: #2d5be3; }
      main { flex: 1; overflow-y: auto; padding: 16px; }
      header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      button { background: #2d5be3; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
      table { width: 100%; border-collapse: collapse; }
      td, th { padding: 6px 8px; border-bottom: 1px solid #333; text-align: left; font-size: 13px; }
    </style>
  </head>
  <body>
    <nav>
      <div class="item active">Dashboard</div>
      <div class="item">Reports</div>
      <div class="item">Settings</div>
    </nav>
    <main>
      <header>
        <h2 id="title">bench mini-app</h2>
        <button id="incr" type="button">count: <span id="count">0</span></button>
      </header>
      <table>
        <thead><tr><th>#</th><th>name</th><th>value</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script src="bridge.js"></script>
    <script src="app.js"></script>
  </body>
</html>
